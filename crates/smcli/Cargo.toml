[package]
name = "smcli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29", features = ["use-dev-tty"] }
libc = "0.2.191"
nucleo-matcher = "0.3.1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "std"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smcli-core = { version = "0.1.0", path = "../smcli-core" }
smcli-search = { version = "0.1.0", path = "../smcli-search" }
taladb = "0.12"
uuid = { version = "1.28.0", features = ["v4"] }
