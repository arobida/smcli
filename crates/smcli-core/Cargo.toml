[package]
name = "smcli-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
libc = "0.2.191"
notify = "8.2.0"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

[dev-dependencies]
tempfile = "3.27.0"
